name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            crates/raso-rules
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
        env:
          RUSTFLAGS: -D warnings

  rules:
    name: Rules engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/raso-rules
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/raso-rules
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
        env:
          RUSTFLAGS: -D warnings
      - name: Kiểm tra luật các đề
        run: |
          dirs=""
          for d in ../../pkgs/games/*/; do
            [ -f "${d}rules.yaml" ] && dirs="$dirs $d"
          done
          cargo run --features cli --bin raso -- check $dirs
      - run: cargo install wasm-pack --locked
      - run: ./scripts/build-rules-wasm.sh
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: raso-rules-wasm
          path: crates/raso-rules/pkg

  web:
    name: Web client
    runs-on: ubuntu-latest
    needs: rules
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raso-rules-wasm
          path: crates/raso-rules/pkg
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Chạy test trước `check`: `check` còn 9 lỗi typed-href có sẵn từ upstream
      # và sẽ dừng job, test luật/WASM phải chạy được bất kể.
      - run: pnpm vitest run
      - run: pnpm run check:bindings
      - run: pnpm run check
      - run: pnpm run build

  api:
    name: Cloudflare API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:bindings
      - run: pnpm run check
      - run: pnpm run build
